name: Update price snapshots

# Refreshes data/prices/*.json for every ticker in data/portfolio.json.
# Runs daily, on every push that touches the portfolio, and on demand.

on:
  schedule:
    # 12:00 UTC — after the Jakarta close (16:00 WIB / 09:00 UTC) and before
    # the US open, so IDX and US tickers both land a completed session.
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/portfolio.json"
      - "scripts/update_prices.py"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch daily closes
        id: fetch
        continue-on-error: true
        run: python3 scripts/update_prices.py --range 5y

      - name: Commit updated snapshots
        run: |
          if [ -z "$(git status --porcelain data/prices)" ]; then
            echo "No price changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices
          git commit -m "chore: refresh price snapshots ($(date -u +%Y-%m-%d))"
          git push

      - name: Report a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Yahoo Finance did not answer for at least one ticker."
          echo "The site falls back to fetching prices live in the browser, so the chart still works."
