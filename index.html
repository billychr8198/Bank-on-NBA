<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banking on NBA — daily, weekly & monthly budget tracker</title>
<meta name="description" content="A budgeting tracker with a season attached. Log your money every day, grow the league, and unlock all 30 NBA franchises and 55 Hall of Fame legends across 365 days.">
<meta name="theme-color" content="#17110B">
<meta name="color-scheme" content="dark light">

<!-- Resolve the theme before the stylesheet paints, so the page never flashes
     the wrong one. Kept inline and tiny on purpose. -->
<script>
(function () {
  try {
    var p = localStorage.getItem("banking-on-nba:theme") || "auto";
    var t = (p === "light" || p === "dark") ? p
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.style.colorScheme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#F4EFE6" : "#17110B");
  } catch (e) {}
})();
</script>
